---
name: CIFuzz
"on":
  pull_request: 
  workflow_dispatch: ~
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  cifuzzEntrypoint:
    uses: melodium-tech/github-actions/.github/workflows/melodium-ubuntu.yml@temp_ubuntu
    with:
      version: 0.9.0-pre.5
      command: |
        run .melodium-ci/Compo.toml cifuzzEntrypoint --logs_directory '"logs/"' --github_contexts '$''{{{{ { "github": ${{ toJSON(github) }}, "vars": ${{ toJSON(vars) }} } }}}}' 
      artifact-path: logs/
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"
