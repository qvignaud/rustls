---
name: rustls
permissions:
  contents: read
"on":
  push:
    branches:
      - main
      - rel-*
      - ci/*
    tags:
      - "**"
  pull_request: ~
  merge_group: ~
  schedule:
    - cron: 0 18 * * *
  workflow_dispatch: ~
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  buildUbuntuLatestEntrypoint:
    runs-on: ubuntu-latest
    uses: melodium-tech/github-actions/.github/workflows/melodium-ubuntu.yml@temp_ubuntu
    with:
      version: 0.9.0-pre.5
      command: |
        run .melodium-ci/Compo.toml buildUbuntuLatestEntrypoint --logs_directory '"logs/"' --github_contexts '$''{{{{ { "github": ${{ toJSON(github) }}, "vars": ${{ toJSON(vars) }} } }}}}' 
      artifact-path: logs/
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"
  buildmatrixOsEntrypoint:
    runs-on: "${{ matrix.os }}"
    uses: melodium-tech/github-actions/.github/workflows/melodium-ubuntu.yml@temp_ubuntu
    with:
      version: 0.9.0-pre.5
      command: |
        run .melodium-ci/Compo.toml buildmatrixOsEntrypoint --logs_directory '"logs/"' --github_contexts '$''{{{{ { "github": ${{ toJSON(github) }}, "vars": ${{ toJSON(vars) }} } }}}}' 
      artifact-path: logs/
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"