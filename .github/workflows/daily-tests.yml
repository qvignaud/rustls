---
name: daily-tests
permissions:
  contents: read
"on":
  workflow_dispatch: ~
  schedule:
    - cron: 15 18 * * *
jobs:
  dailyTestsUbuntuLatestEntrypoint:
    runs-on: ubuntu-latest
    uses: melodium-tech/github-actions/.github/workflows/melodium-ubuntu.yml@temp_ubuntu
    with:
      version: 0.9.0-pre.5
      command: |
        run .melodium-ci/Compo.toml dailyTestsUbuntuLatestEntrypoint --logs_directory '"logs/"' --github_contexts '$''{{{{ { "github": ${{ toJSON(github) }}, "vars": ${{ toJSON(vars) }} } }}}}' 
      artifact-path: logs/
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"
  dailyTestsmatrixOsEntrypoint:
    runs-on: "${{ matrix.os }}"
    uses: melodium-tech/github-actions/.github/workflows/melodium-ubuntu.yml@temp_ubuntu
    with:
      version: 0.9.0-pre.5
      command: |
        run .melodium-ci/Compo.toml dailyTestsmatrixOsEntrypoint --logs_directory '"logs/"' --github_contexts '$''{{{{ { "github": ${{ toJSON(github) }}, "vars": ${{ toJSON(vars) }} } }}}}' 
      artifact-path: logs/
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"